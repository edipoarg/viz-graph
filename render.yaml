services:
  # ── Backend ──────────────────────────────────────────────────────────────
  - type: web
    name: edipo-viz
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    buildArgs:
      - key: DUCKDB_URL
        sync: false          # set to GitHub Release download URL
    envVars:
      - key: NEO4J_URI
        sync: false          # set manually in Render dashboard
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "https://edipo-viz-frontend.onrender.com"
      - key: DUCKDB_PATH
        value: /data/poder_economico.duckdb

  # ── Frontend ─────────────────────────────────────────────────────────────
  - type: web
    name: edipo-viz-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        sync: false          # set to your backend Render URL, e.g. https://edipo-viz-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
